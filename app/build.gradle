plugins {
    id 'com.android.application'
}

android {
    namespace 'it.misericordiaadrano.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "it.misericordiaadrano.monitor"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
