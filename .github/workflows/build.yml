name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # l'SDK Android è già presente sulla macchina di GitHub
      - run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MonitorTrasporti-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # copia l'APK nel ramo "apk" (così si scarica anche dalla pagina del progetto)
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/MonitorTrasporti.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rfq .
          cp /tmp/MonitorTrasporti.apk .
          git add MonitorTrasporti.apk
          git commit -qm "APK Monitor Trasporti"
          git push -f origin apk
